<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">About Sushir, as a terminal</title>
<desc id="d">Role: Python &amp; API dev who also draws planets; Stack: Python · Flask · REST/JSON · pytest; Render: three.js r170 · WebGL2 · GLSL · bloom; Sky: 3,232 real stars, placed by my own math; Accuracy: Sun 0.006° · Moon 0.028° vs PyEphem; Tests: 15 passing on Market Observatory; Chess: 570 games · 1.e3 wins 63% of the time; Cooking: a 3D configurator, a duo display, more; Status: open to junior, contract &amp; project work; Rate: Flask/API fixes from $40, scope first; Motto: if it renders, it ships</desc>
